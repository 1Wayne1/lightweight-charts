name: crypto-terminal
services:
  terminal:
    build:
      context: ../..
      dockerfile: services/sync-api/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN:?Set SYNC_TOKEN in deploy/terminal/.env (at least 8 characters)}
      DB_PATH: /data/terminal.db
      STATIC_DIR: /app/public
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MARKET_PROXY_URL: ${MARKET_PROXY_URL:-}
      BINANCE_SPOT_REST: ${BINANCE_SPOT_REST:-}
      BINANCE_PERPETUAL_REST: ${BINANCE_PERPETUAL_REST:-}
      BINANCE_SPOT_WS: ${BINANCE_SPOT_WS:-}
      BINANCE_PERPETUAL_WS: ${BINANCE_PERPETUAL_WS:-}
    ports:
      - "${SYNC_BIND:-127.0.0.1}:${SYNC_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
