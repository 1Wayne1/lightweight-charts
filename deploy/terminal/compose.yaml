name: crypto-terminal
services:
  sync-api:
    build:
      context: ../../services/sync-api
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNC_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: terminal
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../services/sync-api/migrations/001-initial.sql:/docker-entrypoint-initdb.d/001-initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal -d terminal"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
