<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lightweight Charts — TradingView-Style Drawing Tools</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
				background: #131722;
				color: #d1d4dc;
			}
			body.theme-light {
				background: #ffffff;
				color: #131722;
			}
			.app-shell {
				display: flex;
				flex-direction: column;
				width: 100%;
				height: 100%;
			}
			.topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				height: 40px;
				padding: 0 14px;
				background: #1e222d;
				border-bottom: 1px solid #2a2e39;
				font-size: 13px;
				flex-shrink: 0;
			}
			body.theme-light .topbar {
				background: #ffffff;
				border-bottom-color: #e0e3eb;
			}
			.topbar-left {
				display: flex;
				align-items: center;
				gap: 12px;
			}
			.symbol-badge {
				font-weight: 700;
				letter-spacing: 0.3px;
			}
			.status-pill {
				font-size: 12px;
				color: #787b86;
			}
			.topbar-right {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.top-btn {
				height: 26px;
				padding: 0 10px;
				border-radius: 5px;
				border: 1px solid #363a45;
				background: transparent;
				color: inherit;
				font-size: 12px;
				cursor: pointer;
			}
			body.theme-light .top-btn {
				border-color: #d1d4dc;
			}
			.top-btn:hover {
				background: rgba(41, 98, 255, 0.14);
				border-color: #2962ff;
			}
			.workspace {
				display: flex;
				flex: 1 1 auto;
				min-height: 0;
				width: 100%;
			}
			#toolbar-host {
				display: flex;
				flex-shrink: 0;
			}
			#chart-stage {
				position: relative;
				flex: 1 1 auto;
				min-width: 0;
				min-height: 0;
			}
			#chart {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div class="app-shell">
			<div class="topbar">
				<div class="topbar-left">
					<span class="symbol-badge">BTCUSD · 1D</span>
					<span id="status-text" class="status-pill">光标模式 · 点击左侧工具开始绘图</span>
				</div>
				<div class="topbar-right">
					<button id="btn-samples" class="top-btn" type="button">加载示例绘图</button>
					<button id="btn-theme" class="top-btn" type="button">切换浅色主题</button>
				</div>
			</div>
			<div class="workspace">
				<div id="toolbar-host"></div>
				<div id="chart-stage">
					<div id="chart"></div>
				</div>
			</div>
		</div>
		<script type="module" src="./example.ts"></script>
	</body>
</html>
